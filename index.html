<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kan ik buiten blowen?</title>
  <meta name="description" content="Kan ik vandaag buiten blowen? Check de wind en regen op jouw locatie.">
  <meta name="theme-color" content="#1f6b3b">
  <meta property="og:title" content="Kan ik buiten blowen?">
  <meta property="og:description" content="Check op basis van wind en regen of je vandaag lekker buiten kan blowen.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="title">Kan ik buiten blowen?</h1>

    <!-- Animated smoking blunt mascot (self-drawn SVG + CSS) -->
    <div class="blunt-stage" aria-hidden="true">
      <div class="smoke">
        <span class="puff puff1"></span>
        <span class="puff puff2"></span>
        <span class="puff puff3"></span>
        <span class="puff puff4"></span>
        <span class="puff puff5"></span>
        <span class="puff puff6"></span>
        <span class="puff puff7"></span>
        <span class="puff puff8"></span>
      </div>
      <svg class="blunt" viewBox="0 0 300 440" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fffdf6"/>
            <stop offset="0.5" stop-color="#f1e7cc"/>
            <stop offset="1" stop-color="#e2d2a8"/>
          </linearGradient>
          <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="0.5" stop-color="#ff6a1a"/>
            <stop offset="1" stop-color="#7a1d05"/>
          </radialGradient>
        </defs>

        <!-- ARMS (drawn first, behind body so they emerge from the edge) -->
        <g stroke="#2a211c" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M118 296 C96 322 64 344 46 366"/>
          <path d="M182 296 C206 322 240 344 258 366"/>
        </g>
        <!-- left glove: OK sign -->
        <g class="hand">
          <circle cx="42" cy="384" r="22" fill="#fff" stroke="#2a211c" stroke-width="5"/>
          <circle cx="36" cy="380" r="8" fill="none" stroke="#2a211c" stroke-width="5"/>
          <path d="M48 372 q12 -6 14 6" fill="none" stroke="#2a211c" stroke-width="5" stroke-linecap="round"/>
        </g>
        <!-- right glove: thumbs up -->
        <g class="hand">
          <circle cx="262" cy="384" r="22" fill="#fff" stroke="#2a211c" stroke-width="5"/>
          <path d="M262 366 q10 0 9 14" fill="none" stroke="#2a211c" stroke-width="5" stroke-linecap="round"/>
        </g>

        <!-- BODY of the joint (tapered, rolled paper) -->
        <path d="M92 168 L208 168 L168 410 Q150 432 132 410 Z"
              fill="url(#paper)" stroke="#2a211c" stroke-width="5" stroke-linejoin="round"/>
        <!-- rolled-paper seam + twist lines -->
        <path d="M150 200 L142 410" stroke="#c9b888" stroke-width="3" fill="none" opacity="0.8"/>
        <path d="M126 250 q24 8 48 0 M120 300 q30 10 60 0 M132 360 q18 6 36 0"
              stroke="#cdbd92" stroke-width="2.5" fill="none" opacity="0.7"/>
        <!-- twisted tip -->
        <path d="M132 410 q18 22 36 0 q-6 26 -18 26 q-12 0 -18 -26 Z"
              fill="#e7d6a8" stroke="#2a211c" stroke-width="4" stroke-linejoin="round"/>

        <!-- CHARRED EMBER at the lit top -->
        <ellipse cx="150" cy="168" rx="58" ry="16" fill="#2a211c"/>
        <g class="ember">
          <ellipse cx="150" cy="160" rx="56" ry="20" fill="url(#emberGlow)" stroke="#2a211c" stroke-width="4"/>
          <path d="M112 158 q14 -10 26 2 q12 -12 26 0 q12 -10 24 4"
                fill="none" stroke="#7a1d05" stroke-width="4" stroke-linecap="round"/>
          <circle cx="128" cy="160" r="4" fill="#ffe27a"/>
          <circle cx="170" cy="156" r="4" fill="#ffe27a"/>
        </g>

        <!-- FACE -->
        <!-- winking eye (left) -->
        <path d="M104 250 q16 16 32 0" fill="none" stroke="#2a211c" stroke-width="6" stroke-linecap="round"/>
        <!-- open eye (right), slightly bloodshot rim -->
        <circle cx="186" cy="248" r="22" fill="#fff" stroke="#e89bb0" stroke-width="4"/>
        <circle cx="190" cy="250" r="10" fill="#4caf50"/>
        <circle cx="190" cy="250" r="5" fill="#1c2521"/>
        <circle cx="187" cy="247" r="2.5" fill="#fff"/>
        <!-- cheek blush -->
        <ellipse cx="120" cy="300" rx="12" ry="7" fill="#f6b6c4" opacity="0.7"/>
        <!-- big smiling mouth -->
        <path d="M118 300 Q150 350 196 304 Q160 326 118 300 Z"
              fill="#7a1f1f" stroke="#2a211c" stroke-width="5" stroke-linejoin="round"/>
        <path d="M124 302 Q150 312 190 305" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <!-- tongue -->
        <path d="M140 330 q16 18 34 2 q-4 16 -18 16 q-14 0 -16 -18 Z" fill="#e36a7a"/>
      </svg>
    </div>

    <!-- The verdict -->
    <p class="verdict-line">De verwachting voor vandaag is:</p>
    <div id="answer" class="answer answer--loading">…</div>
    <p id="reason" class="reason">Je locatie wordt opgevraagd…</p>

    <!-- Weather details -->
    <div id="details" class="details" hidden>
      <div class="detail">
        <span class="detail-label">Wind</span>
        <span id="wind" class="detail-value">–</span>
      </div>
      <div class="detail">
        <span class="detail-label">Regen</span>
        <span id="rain" class="detail-value">–</span>
      </div>
      <div class="detail">
        <span class="detail-label">Locatie</span>
        <span id="place" class="detail-value">–</span>
      </div>
    </div>

    <button id="retry" class="retry" hidden>Opnieuw proberen</button>

    <footer class="footer">
      Weerdata van <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>.
      Blowen? Doe het verstandig en alleen waar het mag.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
